# Tyche default configuration.
#
# Secrets never live here. Model credentials come from the environment
# (API_KEY, API_BASE, MODEL_NAME, MODEL_PROVIDER), the same names openjiuwen's
# auto_research modules read, so one .env drives both layers.

models:
  # Shared defaults. Per-role entries below override only the fields they set.
  default:
    provider: ${MODEL_PROVIDER:-OpenAI}
    model_name: ${MODEL_NAME:-deepseek-flash}
    api_base: ${API_BASE:-https://api.deepseek.com}
    api_key_env: API_KEY
    timeout: 600
    temperature: 0.4
    # Reasoning models (DeepSeek V4, ...) spend part of max_tokens on hidden
    # reasoning; a small cap returns empty answers.
    max_tokens: 32768
    # Extra JSON body fields sent with every request of this role, e.g.
    # {thinking: {type: disabled}} to switch DeepSeek reasoning off.
    extra_body: {}
    # Prompt-cache adapter (tyche/cache.py). "auto" picks a profile from the
    # provider, the api_base host, and the model; name a profile (deepseek,
    # openai, dashscope, explicit, automatic, ...) to force one, or "off".
    cache: auto
    # Optional retention hint for providers that take one (OpenAI
    # prompt_cache_retention, e.g. 24h on models that support it). Empty sends none.
    cache_retention: ""
  planner: {}
  writer: {}
  # A different model for reviewing reduces self-agreement bias. Leave empty
  # to reuse the default model.
  reviewer:
    model_name: ${TYCHE_REVIEW_MODEL_NAME:-}
    temperature: 0.0
  # Model used by openjiuwen's experiment agents (design, coding, reflection).
  experiments:
    model_name: ${TYCHE_EXPERIMENT_MODEL_NAME:-}
  # Model the generated experiment code calls as its subject (exported to it as
  # API_KEY/API_BASE/MODEL_NAME). Kept separate because experiments make many calls.
  subject: {}

workspace:
  # Runs, caches, and the cross-run memory database live here.
  root: ${TYCHE_HOME:-workspace}

literature:
  sources: [arxiv, semantic_scholar, openalex]
  contact_email: ${TYCHE_CONTACT_EMAIL:-}
  semantic_scholar_api_key_env: S2_API_KEY
  openalex_api_key_env: OPENALEX_API_KEY
  per_query_results: 12
  max_queries: 8
  prerank_pool: 60
  max_papers: 24
  min_papers: 8
  expansion_seeds: 5
  expansion_per_seed: 10
  evidence_cards_per_paper: 2
  request_timeout: 30
  min_interval_seconds:
    export.arxiv.org: 3.1
    api.semanticscholar.org: 1.1
    api.openalex.org: 0.2
    api.crossref.org: 0.2
  cache_ttl_days: 30

experiments:
  # openjiuwen: run openjiuwen auto_research's design -> code -> execute ->
  #   reflect loop with its survey and reporting modules disabled.
  # imported: read metrics JSON files you produced yourself (--results-dir).
  # fixture: synthetic metrics for the offline selftest only.
  engine: openjiuwen
  # Directory of <variant>.metrics.json files for the imported engine (saved with the run).
  results_dir: null
  max_rounds: 30
  max_code_retries: 3
  max_design_revisions: 3
  max_execution_retries: 2
  max_variants: 4
  # Model calls one coding cycle of openjiuwen's code agent may make (its factory
  # default of 15 is too few to write and smoke-test a multi-file experiment).
  code_agent_max_iterations: 80
  # Stop before analysis when more than this fraction of a variant's per_question
  # items carry an error (failed model calls), since they would be scored as wrong.
  max_failed_item_rate: 0.01
  constraints:
    - "This is a short paper: implement one proposed method and at most three baselines or ablations."
    - "Use small, controlled, reproducible tasks (synthetic or public benchmark subsets) that finish within the execution timeout."
    - "Record per-item outcomes in per_question so confidence intervals and paired tests can be computed: every row needs an id that is unique across seeds (for example seed:question), the grouping fields the metrics are split by (for example stratum), and the scored outcome of that item (for example a boolean correct, or the per-item value of each metric), so that the mean of the rows reproduces each reported metric."
    - "Implement every baseline faithfully and competitively, as its proponents would; in the smoke test, check that no variant abstains or answers unknown on most items, and fix the implementation if one does."
    - "Never hard-code or simulate metric values; every number must come from executed runs."
    - "The model behind API_KEY/API_BASE/MODEL_NAME may be a reasoning model whose hidden reasoning counts toward max_tokens and can take several thousand tokens on counting or multi-step questions: request max_tokens of at least 8192 per call, use only the final message content, and if the content is empty retry once with twice the max_tokens."
    - "Write only result metrics at the top level of each metrics file; put run settings (budgets, concurrency, temperature, token limits) and run diagnostics under a nested settings object."
    - "Report a metric that could not be computed (for example over an empty subset) as null or mark it false in a top-level `metric_defined` map; never write 0 as a placeholder."
    - "Record a call that still fails in that item's `error` field instead of silently scoring it wrong; keep failed items under 1% of every variant, since failed items are not evidence about the method."
    - "While implementing code, validate with the smoke test or a tiny subset only; never launch the full experiment there, because the execution stage runs every variant."
    - "Make repeated model calls cache-friendly: put the fixed instructions and any context shared across items first, byte-identical in every call, and the per-item content last, so the provider's prompt cache serves the shared prefix; record the cached prompt tokens the API reports (DeepSeek usage.prompt_cache_hit_tokens, OpenAI usage.prompt_tokens_details.cached_tokens) in the run diagnostics."
    - "Read credentials only from the environment and never print, log, or write API_KEY (or any part of it) to files or outputs."
    - "Keep each variant's full run under about 600 model calls and run independent calls concurrently (at most 8 at a time) so it finishes well inside the execution timeout; use identical model settings for every variant."

analysis:
  bootstrap_resamples: 2000
  permutation_resamples: 5000
  confidence: 0.95
  seed: 20260925

paper:
  template: iclr2027
  max_main_pages: 5
  anonymous: true
  authors: []
  # Human-review disclosure used verbatim in the ICLR AI use statement. Leave it
  # empty until a person has actually reviewed the paper; the statement then says
  # that no human review was recorded. Example, once true:
  #   The submitting team inspected the generated plan, experiment code, results,
  #   and manuscript and takes responsibility for the final content.
  human_review_statement: ""
  sections:
    abstract: {min_words: 120, max_words: 200}
    introduction: {min_words: 380, max_words: 550}
    related_work: {min_words: 250, max_words: 400, min_citations: 6}
    method: {min_words: 350, max_words: 600}
    experiments: {min_words: 350, max_words: 600}
    analysis: {min_words: 200, max_words: 400}
    conclusion: {min_words: 80, max_words: 150}
  compile_repair_attempts: 3
  trim_attempts: 3
  latex_timeout: 180

review:
  reviewers: [rigor, positioning, clarity]
  samples_per_reviewer: 1
  max_rounds: 3
  target_composite: 7.5
  acceptance_tolerance: 0.15
  plateau_rounds: 2
  reflag_cap: 2
  max_findings_per_revision: 8
  auditor: true

memory:
  context_budgets:
    plan: 6000
    survey_screen: 12000
    section: 9000
    review: 24000
    revise: 12000
  evidence_per_section: 12
  lessons_per_section: 5

evolution:
  promote_after_runs: 2
  promote_after_helped: 1
  retire_after_misses: 2
